name: Static R audit

on:
  pull_request:
  push:
    branches:
      - main
      - reproducibility-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse all R source and audit repository structure
        run: Rscript scripts/02_static_source_audit.R

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-r-audit
          path: outputs/static-audit/
          if-no-files-found: warn
